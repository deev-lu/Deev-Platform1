    <!-- Brand fonts: Typold Bold (display) + JetBrains Mono (labels) — self-hosted -->
    <link
      rel="preload"
      href="/fonts/typold-bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Premium typography: Inter variable — loaded async so it never blocks paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap"
      />
    </noscript>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
      /* Pre-paint background per theme to avoid a flash of the wrong mode */
      html {
        background: #f8fafc;
      }
      html.dark {
        background: #06060a;
      }
      /* Brand font available to the instant loader too */
      @font-face {
        font-family: "Typold";
        src: url("/fonts/typold-bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      /* Instant branded paint while the app JS loads */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 22px;
      }
      #app-loader .wm {
        font-family: "Typold", -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
        letter-spacing: 0.02em;
        font-size: 26px;
        color: #0a0f2e;
      }
      html.dark #app-loader .wm {
        color: #fff;
      }
      #app-loader .bar {
        width: 120px;
        height: 2px;
        border-radius: 2px;
        background: rgba(120, 130, 160, 0.18);
        overflow: hidden;
      }
      #app-loader .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #3CE7FC, #2563F6);
        animation: loaderslide 1s ease-in-out infinite;
      }
      @keyframes loaderslide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>

    <!-- Apply saved theme before paint (defaults to dark) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          document.documentElement.classList.toggle("dark", t !== "light");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div id="app-loader" aria-hidden="true">
        <div class="wm">DEEV</div>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
