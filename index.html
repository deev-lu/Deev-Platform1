    <!-- Premium typography: Inter variable -->

    />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
      /* Pre-paint background per theme to avoid a flash of the wrong mode */
      html {
        background: #f8fafc;
      }
      html.dark {
        background: #06060a;
      }
    </style>

    <!-- Apply saved theme before paint (defaults to dark) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          document.documentElement.classList.toggle("dark", t !== "light");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
