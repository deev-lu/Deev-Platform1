    <!-- Structured data: Organization -->
    <script type="application/ld+json">

        "@context": "https://schema.org",

        },

    <!-- Brand fonts: Typold Bold (display) + JetBrains Mono (labels), self-hosted -->
    <link
      rel="preload"
      href="/fonts/typold-bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Body typography: Inter variable, self-hosted like the other two.
         It used to come from fonts.googleapis.com, which meant every visitor's
         IP reached Google before they had agreed to anything, and a
         render-blocking round trip to a third party on every page. Same file,
         served from our own origin. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-opsz.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
      /* Pre-paint background per theme to avoid a flash of the wrong mode */
      html {
        background: #ffffff;
      }
      html.dark {
        background: #08090b;
      }
      /* Inter, variable with the optical-size axis, latin subset. Same axes
         the Google stylesheet used to request, so nothing shifts. */
      @font-face {
        font-family: "Inter";
        src: url("/fonts/inter-latin-opsz.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Brand font available to the instant loader too */
      @font-face {
        font-family: "Typold";
        src: url("/fonts/typold-bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      /* Instant branded paint while the app JS loads */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 22px;
      }
      #app-loader .wm {
        font-family: "Typold", -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
        letter-spacing: 0.02em;
        font-size: 26px;
        color: #0a0b0d;
      }
      html.dark #app-loader .wm {
        color: #f2f4f6;
      }
      #app-loader .bar {
        width: 120px;
        height: 2px;
        border-radius: 2px;
        background: rgba(120, 130, 160, 0.18);
        overflow: hidden;
      }
      #app-loader .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #3CE7FC, #2563F6);
        animation: loaderslide 1s ease-in-out infinite;
      }
      @keyframes loaderslide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>

    <!-- Apply the stored theme before paint (defaults to dark) so there is
         no flash of the wrong mode. Mirrored in App.tsx, change both. -->
    <script>
      (function () {
        try {
          document.documentElement.classList.toggle(
            "dark",
            localStorage.getItem("theme") !== "light"
          );
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div id="app-loader" aria-hidden="true">
        <div class="wm">DEEV</div>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
